<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #171717; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0 0 10px; color: #525252; }
      button { width: 100%; padding: 9px; border: 0; border-radius: 10px; background: #171717; color: #fff; font-weight: 600; cursor: pointer; }
      label { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px; }
      a { color: #525252; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Live Try-On</h1>
    <p>Rê chuột lên ảnh quần áo rồi bấm <b>Thử đồ</b>, chuột phải vào ảnh, hoặc kéo ảnh vào cửa sổ thử đồ.</p>
    <button id="open">Mở phòng thử đồ</button>
    <label><input type="checkbox" id="site" /> Hiện nút “Thử đồ” trên <span id="host">trang này</span></label>
    <a href="options.html" target="_blank">Cài đặt (địa chỉ web app)</a>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
