<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Live Try-On: cài đặt</title>
    <style>
      body { max-width: 520px; margin: 40px auto; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #171717; }
      input { width: 100%; padding: 8px; border: 1px solid #d4d4d4; border-radius: 8px; box-sizing: border-box; }
      button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 8px; background: #171717; color: #fff; cursor: pointer; }
      small { color: #737373; }
    </style>
  </head>
  <body>
    <h1>Cài đặt Live Try-On</h1>
    <label for="app">Địa chỉ web app</label>
    <input id="app" placeholder="http://localhost:3000" />
    <small>Dev: <code>http://localhost:3000</code>. Khi deploy, đổi sang domain thật (bắt buộc HTTPS để dùng camera).</small>
    <br />
    <button id="save">Lưu</button> <span id="msg"></span>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
